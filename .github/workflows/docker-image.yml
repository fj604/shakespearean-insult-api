name: Docker Image CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:

  build:

    runs-on: self-hosted

    env:
      APP_NAME: flask-service
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      PYTHONUNBUFFERED: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ${{ env.APP_NAME }}:latest
  
    - name: Stop and remove old container
      run: |
        if docker container inspect "${{ env.APP_NAME }}" >/dev/null 2>&1; then
          docker rm -f "${{ env.APP_NAME }}"
        else
          echo "No existing container named ${{ env.APP_NAME }} found."
        fi

    - name: Validate OPENAI_API_KEY is available
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "OPENAI_API_KEY is empty or not configured for this workflow run."
          exit 1
        fi

    - name: Deploy with docker compose
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        docker compose up -d --force-recreate --remove-orphans

    - name: Smoke check deployed service
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Waiting for service to become ready on http://localhost:18000/insult ..."
        for i in {1..20}; do
          if curl --fail --silent --show-error http://localhost:18000/insult >/dev/null; then
            echo "Smoke check succeeded on attempt $i."
            exit 0
          fi
          echo "Attempt $i failed; retrying in 3 seconds..."
          sleep 3
        done
        echo "Service did not become ready in time; failing smoke check."
        exit 1
