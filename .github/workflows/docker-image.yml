name: Docker Image CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:

  build:

    runs-on: self-hosted

    env:
      APP_NAME: flask-service
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      PYTHONUNBUFFERED: true

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ${{ env.APP_NAME }}:latest
  
    - name: Stop and remove old container
      run: |
        docker stop ${{ env.APP_NAME }} || true
        docker rm ${{ env.APP_NAME }} || true

    - name: Run new container
      run: |
        docker run -d --name ${{ env.APP_NAME }} --restart unless-stopped -p 18000:8000 -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} -e PYTHONUNBUFFERED=${{ env.PYTHONUNBUFFERED }} ${{ env.APP_NAME }}:latest
